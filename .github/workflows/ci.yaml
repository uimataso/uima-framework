# Runs the CI gate, `just ci`, on every push.
name: ci

on:
  push:
  workflow_dispatch:

# cache-nix-action purges this workflow's older caches.
permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single-user nix, so the store belongs to the runner's user and
      # cache-nix-action can restore it.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Saves /nix/store between runs (toolchain, crates, earlier builds).
      # The key changes with anything that changes what gets built; a miss
      # restores the newest older cache and saves a new one at the end.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Keep the saved store small: GC down to this before saving.
          gc-max-store-size-linux: 2G
          # Delete older caches of this workflow so they don't crowd the
          # repo's 10 GB cache quota.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: CI
        run: nix develop -c just ci
