# Runs the CI gate, `just ci`, on every push.
name: ci

on:
  push:
  workflow_dispatch:

# cache-nix-action purges this workflow's older caches.
permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI builds once from scratch, so incremental data only grows target/.
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single-user nix, so the store belongs to the runner's user and
      # cache-nix-action can restore it.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      # Saves /nix/store between runs (toolchain, crates, earlier builds).
      # The key changes with anything that changes what gets built or how
      # it's cached; a miss restores the newest older cache and saves a new
      # one at the end.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'rust-toolchain.toml', 'Cargo.lock', '.github/workflows/ci.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Keep the saved store small: GC down to this before saving.
          gc-max-store-size-linux: 2G
          # Delete older caches of this workflow so they don't crowd the
          # repo's 10 GB cache quota.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # The tests compile outside the nix store, so cargo's downloads and
      # target/ are cached here. A new Cargo.lock restores the older
      # downloads, which only lack the new crates.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      # A new Cargo.lock restores the target/ of an older one on the same
      # toolchain, so only the changed crates build. Their old builds stay in
      # it until a new toolchain starts target/ over.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: CI
        run: nix develop -c just ci

      # cache-nix-action collects garbage before saving, and keeps only what
      # a GC root holds. The dev shell holds the toolchain, each check holds
      # the dependencies it built, and the flake inputs are rooted so they
      # aren't unpacked again.
      - name: Keep the build in the cache
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          mkdir -p .gcroots
          nix develop --profile .gcroots/dev-shell -c true
          nix eval --json ".#checks.$system" --apply builtins.attrNames \
            | jq -r --arg system "$system" '.[] | ".#checks.\($system).\(.)"' \
            | xargs nix build --out-link .gcroots/check
          nix flake archive --json | jq -r '.. | .path? // empty' \
            | xargs nix-store --add-root .gcroots/input --realise >/dev/null
