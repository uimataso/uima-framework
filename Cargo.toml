[workspace]
resolver = "3"
members = ["crates/*/*"]

[workspace.package]
version = "0.0.0"
rust-version = "1.100"
edition = "2024"
authors = ["uima"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"

[workspace.dependencies]
# local crates
uima-cancel = { path = "./crates/base/cancel", version = "0.0.0" }
uima-client-postgres-sqlx = { path = "./crates/client/postgres-sqlx", version = "0.0.0" }
uima-config = { path = "./crates/base/config", version = "0.0.0" }
uima-core = { path = "./crates/base/core", version = "0.0.0" }
uima-http-api = { path = "./crates/http/api", version = "0.0.0" }
uima-http-api-macro = { path = "./crates/http/api-macro", version = "0.0.0" }
uima-http-axum = { path = "./crates/http/axum", version = "0.0.0" }
uima-http-axum-api-macro = { path = "./crates/http/axum-api-macro", version = "0.0.0" }
uima-lock = { path = "./crates/lock/lock", version = "0.0.0" }
uima-log-tracing-subscriber = { path = "./crates/log/tracing-subscriber", version = "0.0.0" }
uima-port-macro = { path = "./crates/base/port-macro", version = "0.0.0" }
uima-runtime = { path = "./crates/base/runtime", version = "0.0.0" }
uima-testing = { path = "./crates/base/testing", version = "0.0.0" }
uima-time = { path = "./crates/base/time", version = "0.0.0" }

# workspace dependencies
anyhow = "1"
axum = { version = "0.8", default-features = false }
futures-util = { version = "0.3", default-features = false }
http = "1"
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false }
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
utoipa = { version = "5", default-features = false }

# dev dependencies
assert2 = "0.4"
proptest = { version = "1", features = ["attr-macro"] }

[profile.dev]
# Disabling debug info speeds up builds a bunch,
# since we don't rely on it for debugging that much.
debug = 0
